services:
  - type: web
    name: space-consultant-recruitment-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: space-consultant-postgres
          property: connectionString
      - key: AIRTABLE_TOKEN
        sync: false
      - key: DOUBLETICK_API_KEY
        sync: false
      - key: DOUBLETICK_WABA_NUMBER
        sync: false
      - key: DOUBLETICK_WEBHOOK_SECRET
        sync: false
      - key: DOUBLETICK_PROXY_URL
        sync: false
      - key: DOUBLETICK_PROXY_TOKEN
        sync: false
      - key: DOUBLETICK_SENDER_NUMBER
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_TEMPLATE_VARIABLES
        value: name,specialization,city,state
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"

databases:
  - name: space-consultant-postgres
    databaseName: space_consultant
    user: space_consultant_user
    plan: free
