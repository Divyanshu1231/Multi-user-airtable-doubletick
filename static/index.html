<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Consultant | Recruitment Desk</title><style>

</style></head><body><div id="login" class="login"><div class="card"><div class="brand" style="color:#14243b">SPACE <span>CONSULTANT</span></div><p class="muted">Recruitment Messaging Desk</p><h1>Sign in</h1><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">Login</button><p id="loginerr" class="muted small"></p></div></div>
<div id="app" class="shell hidden"><header class="top"><div class="brand">SPACE <span>CONSULTANT</span> <small> / Recruitment Desk</small></div><div class="row"><small id="who"></small><button class="btn secondary" onclick="logout()">Logout</button></div></header><div class="layout"><aside id="sidebar"><div class="nav active" data-page="dashboard" onclick="page('dashboard')">Dashboard</div><div class="nav" data-page="analytics" onclick="page('analytics')">Daily Analytics</div><div class="nav" data-page="templates" onclick="page('templates')">My Templates</div><div class="nav" data-page="chats" onclick="page('chats')">WhatsApp Chats</div><div class="nav" data-page="history" onclick="page('history')">Message History</div><div id="adminnav" class="hidden"><hr style="border:0;border-top:1px solid #e5e7eb"><div class="nav" data-page="users" onclick="page('users')">HR User Management</div><div class="nav" data-page="settings" onclick="page('settings')">Airtable Settings</div><div class="nav" data-page="password" onclick="page('password')">Change Admin Password</div></div></aside><main class="main"><div id="view"></div></main></div></div>
<script>
let token=localStorage.getItem('sc_token')||'', me=null, candidateCache=[], currentOptions={}, historyTimer=null;let activeChatPhone='',activeChatName='',chatRefreshTimer=null;const $=id=>document.getElementById(id);const api=async(path,opts={})=>{let r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opts.headers}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error||'Request failed');return d};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function logout(){localStorage.removeItem('sc_token');location.reload()}async function login(){ $('loginerr').textContent='';try{let d=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})}).then(r=>r.json().then(x=>{if(!r.ok)throw Error(x.detail);return x}));token=d.token;localStorage.setItem('sc_token',token);await boot()}catch(e){$('loginerr').textContent=e.message}}
async function boot(){try{me=await api('/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.username+' · '+me.role.toUpperCase();$('adminnav').classList.toggle('hidden',me.role!=='admin');page('dashboard')}catch(e){token='';localStorage.removeItem('sc_token');$('login').classList.remove('hidden')}}function page(p){if(historyTimer){clearInterval(historyTimer);historyTimer=null}document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));({dashboard:dashboard,analytics:analyticsPage,templates:templatesPage,chats:chatsPage,history:historyPage,users:usersPage,settings:settingsPage,password:passwordPage}[p]||dashboard)().catch(err=>showError(err.message))}function showError(s){$('view').innerHTML='<div class="alert">'+esc(s)+'</div>'}
async function dashboard(){ $('view').innerHTML=`<div class="heading"><div><h1>Candidate Search</h1><div class="muted">Filter Airtable candidates and send recruitment messages.</div></div><button class="btn secondary" onclick="loadCandidates(true)">↻ Refresh</button></div><div class="card"><div class="grid"><div class="field"><label>Specialization</label><select id="spec" onchange="filterCandidatesLocal()"><option value="">All specializations</option></select></div><div class="field"><label>State</label><select id="state" onchange="onStateFilterChange()"><option value="">All Indian states / UTs</option></select></div><div class="field"><label>City</label><select id="city" onchange="filterCandidatesLocal()"><option value="">All cities</option></select></div></div><div class="row"><span class="muted" id="candidatecount">Loading candidates…</span><button class="btn secondary" onclick="selectAll(true)">Select all</button><button class="btn secondary" onclick="selectAll(false)">Clear selection</button></div></div><div class="card"><h3>Send to your own Airtable data</h3><div class="muted small" style="margin-bottom:12px">Export a view from Airtable as CSV, upload it here, preview candidates and send an approved WhatsApp template. This upload does not change Airtable records.</div><div class="row"><input id="airtableCsvFile" type="file" accept=".csv,text/csv"><button class="btn secondary" onclick="uploadAirtableCsv()">Upload Airtable CSV</button><span id="csvUploadStatus" class="muted small"></span></div><div id="csvPreviewPanel"></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th><input type="checkbox" onchange="selectAll(this.checked)"></th><th>Candidate</th><th>Specialization</th><th>State</th><th>City</th></tr></thead><tbody id="candidatebody"><tr><td colspan="5">Loading…</td></tr></tbody></table></div><div class="row" style="margin-top:16px"><span id="selectedcount" class="muted">0 selected</span><button class="btn right" onclick="openSend()">Create message & send</button></div></div><div id="sendpanel"></div>`;await loadCandidates()}
let csvUploadId='',csvCandidateRows=[];
async function uploadAirtableCsv(){const f=$('airtableCsvFile')?.files?.[0];if(!f)return alert('Please choose an Airtable CSV file first.');const status=$('csvUploadStatus');status.textContent='Uploading and reading CSV…';try{const fd=new FormData();fd.append('file',f);const r=await fetch('/api/csv/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'CSV upload failed');csvUploadId=d.upload_id;status.textContent=d.total_rows+' rows uploaded';const p=await api('/csv/preview',{method:'POST',body:JSON.stringify({upload_id:csvUploadId})});csvCandidateRows=p.candidates||[];renderCsvPreview(p)}catch(e){status.textContent='';alert(e.message)}}
function renderCsvPreview(p){const el=$('csvPreviewPanel');if(!el)return;el.innerHTML=`<div class="alert" style="margin-top:12px">${p.sendable} of ${p.total} rows have a valid phone number and no duplicate number. Phone Number is the only required CSV field; other columns are optional.</div><div class="row" style="margin:10px 0"><b>${p.total} CSV records</b><span class="muted small">${p.sendable} eligible</span><button class="btn secondary" onclick="csvSelectAll(true)">Select eligible</button><button class="btn secondary" onclick="csvSelectAll(false)">Clear</button></div><div class="tablewrap"><table><thead><tr><th></th><th>Name</th><th>Phone</th><th>Specialization</th><th>State</th><th>City</th><th>Validation</th></tr></thead><tbody>${p.candidates.map(x=>`<tr><td><input class="csvcheck" type="checkbox" onchange="updateCsvCount()" value="${x.id}" ${x.sendable?'':'disabled'}></td><td>${esc(x.name)}</td><td>${esc(x.phone_display||'—')}</td><td>${esc(x.specialization)}</td><td>${esc(x.state)}</td><td>${esc(x.city)}</td><td>${x.sendable?'<span class="pill">Eligible</span>':esc(!x.phone_valid?'Invalid/missing phone':x.duplicate?'Duplicate':'Not eligible')}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:12px"><span id="csvSelectedCount" class="muted">0 selected</span><button class="btn right" onclick="openCsvSend()">Create message & send CSV</button></div><div id="csvSendPanel"></div>`;updateCsvCount()}
function csvSelectAll(v){document.querySelectorAll('.csvcheck:not(:disabled)').forEach(x=>x.checked=v);updateCsvCount()}function csvSelected(){return [...document.querySelectorAll('.csvcheck:checked')].map(x=>x.value)}function updateCsvCount(){if($('csvSelectedCount'))$('csvSelectedCount').textContent=csvSelected().length+' selected'}
async function openCsvSend(){if(!csvSelected().length)return alert('Select at least one eligible CSV candidate.');try{await api('/templates/refresh-status',{method:'POST'})}catch(e){}const ts=await api('/templates');const approved=ts.filter(t=>t.approval_status==='APPROVED');$('csvSendPanel').innerHTML=`<div class="card"><h3>Send approved WhatsApp template</h3><div class="field"><label>Approved template</label><select id="csvTemplate"><option value="">Choose approved template</option>${approved.map(t=>`<option value="${esc(t.template_name)}" data-lang="${esc(t.language||'en')}">${esc(t.name)} — ${esc(t.template_name)} (${esc(t.language||'en')})</option>`).join('')}</select></div><label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:13px"><input id="csvConsentConfirm" type="checkbox" style="margin-top:3px"><span>I confirm that all selected contacts have explicitly agreed to receive WhatsApp messages from our business.</span></label><button class="btn" onclick="sendCsvNow()">Send to ${csvSelected().length} selected CSV candidates</button><div class="muted small" style="margin-top:8px">Phone Number is the only required CSV column. Other fields are optional. Only approved WhatsApp templates can be sent.</div></div>`;$('csvSendPanel').scrollIntoView({behavior:'smooth'})}
async function sendCsvNow(){const name=$('csvTemplate')?.value;if(!name)return alert('Choose an approved template.');const ids=csvSelected();if(!ids.length)return alert('Select candidates first.');const consent=$('csvConsentConfirm')?.checked;if(!consent)return alert('Please confirm that all selected contacts have explicitly opted in.');if(!confirm(`Send approved template ${name} to ${ids.length} CSV contacts?`))return;try{const opt=$('csvTemplate').selectedOptions[0];const lang=opt?.dataset.lang||'en';const b=$('csvSendPanel').querySelector('button');b.disabled=true;b.textContent='Sending…';const d=await api('/csv/send',{method:'POST',body:JSON.stringify({upload_id:csvUploadId,candidate_ids:ids,template_name:name,language:lang,confirm_opt_in:true})});alert(`CSV campaign completed. Accepted/enqueued: ${d.summary.sent}, Failed: ${d.summary.failed}`);$('csvSendPanel').innerHTML=`<div class="alert success">Completed. Accepted/enqueued: ${d.summary.sent}; Failed: ${d.summary.failed}. See Message History for status updates.</div>`}catch(e){alert(e.message);const b=$('csvSendPanel')?.querySelector('button');if(b){b.disabled=false;b.textContent='Send to selected CSV candidates'}}}
const INDIA_STATES_UTS = [
  'Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat',
  'Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh',
  'Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab',
  'Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh',
  'Uttarakhand','West Bengal',
  'Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli and Daman and Diu',
  'Delhi','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry'
];
const STATE_ALIASES = {
  'orissa':'Odisha','uttaranchal':'Uttarakhand','pondicherry':'Puducherry',
  'nct of delhi':'Delhi','new delhi':'Delhi','delhi ncr':'Delhi',
  'jammu & kashmir':'Jammu and Kashmir','j&k':'Jammu and Kashmir',
  'andaman & nicobar islands':'Andaman and Nicobar Islands',
  'andaman nicobar':'Andaman and Nicobar Islands',
  'dadra and nagar haveli':'Dadra and Nagar Haveli and Daman and Diu',
  'daman and diu':'Dadra and Nagar Haveli and Daman and Diu',
  'dadra nagar haveli and daman diu':'Dadra and Nagar Haveli and Daman and Diu'
};
function cleanFieldValues(v){if(Array.isArray(v))return v.map(x=>String(x??'').trim()).filter(Boolean);return String(v??'').trim()?[String(v).trim()]:[]}
function canonicalState(v){const raw=String(v??'').trim();if(!raw)return '';const key=raw.toLocaleLowerCase().replace(/\s+/g,' ').replace(/[.,]$/,'');const alias=STATE_ALIASES[key];if(alias)return alias;return INDIA_STATES_UTS.find(x=>x.toLocaleLowerCase()===key)||''}
function candidateHasState(c,wanted){const vals=cleanFieldValues(c.state);if(wanted==='__EMPTY__')return vals.length===0||vals.every(v=>!String(v).trim());if(!wanted)return true;return vals.some(v=>canonicalState(v)===wanted)}
function candidateHasCity(c,wanted){const vals=cleanFieldValues(c.city);if(wanted==='__EMPTY__')return vals.length===0;if(!wanted)return true;return vals.some(v=>v.toLocaleLowerCase()===wanted.toLocaleLowerCase())}
function renderStateOptions(selected=''){
 const el=$('state');if(!el)return;
 el.innerHTML='<option value="">All Indian states / UTs</option>'+INDIA_STATES_UTS.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')+'<option value="__EMPTY__">Empty / Not specified</option>';
 el.value=selected;
}
function refreshCityOptions(preserve=true){
 const el=$('city');if(!el)return;
 const previous=preserve?el.value:'';
 const state=$('state')?.value||'';
 const spec=($('spec')?.value||'').trim().toLocaleLowerCase();
 const relevant=candidateCache.filter(c=>candidateHasState(c,state)&&(!spec||cleanFieldValues(c.specialization).some(v=>v.toLocaleLowerCase()===spec)));
 const citySet=new Map();
 relevant.forEach(c=>cleanFieldValues(c.city).forEach(v=>{const key=v.trim();if(key&&!citySet.has(key.toLocaleLowerCase()))citySet.set(key.toLocaleLowerCase(),key)}));
 const cities=[...citySet.values()].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
 const hasEmpty=relevant.some(c=>cleanFieldValues(c.city).length===0);
 el.innerHTML='<option value="">All cities</option>'+cities.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')+(hasEmpty?'<option value="__EMPTY__">Empty / Not specified</option>':'');
 if(previous && [...el.options].some(o=>o.value===previous))el.value=previous;else el.value='';
}
function onStateFilterChange(){refreshCityOptions(false);filterCandidatesLocal()}
async function loadCandidates(forceRefresh=false){
  const count=$('candidatecount'), body=$('candidatebody');
  if(count)count.textContent=forceRefresh?'Refreshing Airtable candidates…':'Loading candidates…';
  if(body)body.innerHTML='<tr><td colspan="5" class="muted">Loading candidates…</td></tr>';
  try{
    const d=await api('/candidates'+(forceRefresh?'?refresh=true':''));
    candidateCache=d.candidates||[]; currentOptions=d.options||{};
    const specEl=$('spec');if(specEl){const previous=specEl.value;const vals=currentOptions.specializations||[];specEl.innerHTML='<option value="">All specializations</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(vals.includes(previous))specEl.value=previous;}
    const statePrevious=$('state')?.value||'';renderStateOptions(statePrevious);
    refreshCityOptions(true);
    filterCandidatesLocal();
  }catch(e){
    if(count)count.textContent='Could not load candidates';
    if(body)body.innerHTML='<tr><td colspan="5"><div class="alert">'+esc(e.message)+'<br><button class="btn secondary" style="margin-top:8px" onclick="loadCandidates(true)">Try again</button></div></td></tr>';
  }
}
function filterCandidatesLocal(){
  const spec=($('spec')?.value||'').trim().toLocaleLowerCase();
  const state=$('state')?.value||'';
  // Specialization changes can also change the available city list.
  if($('city')){
    const current=$('city').value;
    refreshCityOptions(true);
    if(current && $('city').value!==current) $('city').value='';
  }
  const city=$('city')?.value||'';
  const filtered=candidateCache.filter(c=>{
    const specs=cleanFieldValues(c.specialization);
    return (!spec||specs.some(v=>v.toLocaleLowerCase()===spec))&&candidateHasState(c,state)&&candidateHasCity(c,city);
  });
  $('candidatecount').textContent=filtered.length+' candidates found';
  $('candidatebody').innerHTML=filtered.map(c=>`<tr><td><input class="candidatecheck" type="checkbox" value="${esc(c.id)}" onchange="updateSelected()"></td><td><b>${esc(c.name||'Unnamed')}</b></td><td>${esc(cleanFieldValues(c.specialization).join(', ')||'—')}</td><td>${esc(cleanFieldValues(c.state).map(v=>canonicalState(v)||v).join(', ')||'—')}</td><td>${esc(cleanFieldValues(c.city).join(', ')||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No matching candidates for the selected filters.</td></tr>';
  updateSelected();
}
function selectAll(v){document.querySelectorAll('.candidatecheck').forEach(x=>x.checked=v);updateSelected()}function selected(){return [...document.querySelectorAll('.candidatecheck:checked')].map(x=>x.value)}function updateSelected(){if($('selectedcount'))$('selectedcount').textContent=selected().length+' selected'}
async function openSend(){if(!selected().length)return alert('Select at least one candidate first.');try{await api('/templates/refresh-status',{method:'POST'})}catch(e){console.warn('Template status refresh:',e.message)}let ts=await api('/templates');$('sendpanel').innerHTML=`<div class="card"><h3>Compose WhatsApp message</h3><div class="tabs"><div class="tab active" onclick="sendTab('approved',this)">Approved DoubleTick template</div><div class="tab" onclick="sendTab('custom',this)">Custom draft</div></div><div id="approvedform"><div class="field"><label>Saved approved template (only approved templates appear)</label><select id="savedApproved" onchange="useSavedApproved()"><option value="">Choose saved template (optional)</option>${ts.filter(t=>t.approval_status==='APPROVED').map(t=>`<option value="${esc(t.template_name)}">${esc(t.name)} — ${esc(t.template_name)} (${esc(t.language||'en')})</option>`).join('')}</select></div><div class="grid"><div class="field"><label>Approved DoubleTick template name</label><input id="templateName" placeholder="e.g. approved_template_name"></div><div class="field"><label>Template language</label><select id="templateLanguage"><option value="en">English (en)</option><option value="hi">Hindi (hi)</option></select></div></div><div class="field"><label>Optional preview / notes</label><textarea id="approvedPreview" placeholder="Hello {{name}}, we have an opening for {{specialization}} in {{city}}..."></textarea></div><div class="muted small">The template name must already be approved for your WhatsApp Business account. Placeholder order must match the configuration in your proxy integration.</div><button class="btn" onclick="sendNow('approved')">Send approved template to ${selected().length} candidates</button></div><div id="customform" class="hidden"><div class="field"><label>Draft message</label><textarea id="customMessage" oninput="previewCustom()" placeholder="Hello {{name}}, we have an opening for {{specialization}} in {{city}}."></textarea></div><div class="muted small">Variables: {{name}}, {{specialization}}, {{state}}, {{city}}</div><div class="templatepreview" id="customPreview">Preview appears here…</div><div class="alert">Custom drafts can be saved and previewed. The supplied proxy only sends approved templates; free-form WhatsApp sending requires a separate verified text endpoint and is subject to the 24-hour messaging window.</div><button class="btn secondary" onclick="saveCustomDraft()">Save custom draft</button></div></div>`;$('sendpanel').scrollIntoView({behavior:'smooth'})}
function useSavedApproved(){let x=$('savedApproved')?.value;if(x)$('templateName').value=x}function sendTab(t,el){document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');$('approvedform').classList.toggle('hidden',t!=='approved');$('customform').classList.toggle('hidden',t!=='custom')}function previewCustom(){let c=candidateCache.find(x=>selected().includes(x.id));let s=$('customMessage').value;for(let [k,v] of Object.entries({name:c?.name||'Candidate',specialization:c?.specialization.join(', ')||'Specialization',state:c?.state.join(', ')||'State',city:c?.city.join(', ')||'City'}))s=s.replaceAll('{{'+k+'}}',v);$('customPreview').textContent=s||'Preview appears here…'}async function saveCustomDraft(){let name=prompt('Give this draft a name:');if(!name)return;try{await api('/templates',{method:'POST',body:JSON.stringify({name,kind:'custom',content:$('customMessage').value})});alert('Draft saved in My Templates.')}catch(e){alert(e.message)}}async function sendNow(kind){if(kind!=='approved')return;let name=$('templateName').value.trim();if(!name)return alert('Enter approved template name');if(!confirm('Send '+name+' to '+selected().length+' selected candidates?'))return;try{let b=$('sendpanel').querySelector('button[onclick*="sendNow"]');b.disabled=true;b.textContent='Sending…';let d=await api('/send',{method:'POST',body:JSON.stringify({candidate_ids:selected(),kind:'approved',template_name:name,language:$('templateLanguage')?.value||'en'})});alert(`Submitted to DoubleTick. Accepted/enqueued: ${d.summary.enqueued??d.summary.sent}, Failed: ${d.summary.failed}. Delivery status will update in Message History.`);$('sendpanel').innerHTML='<div class="card success">Submitted to DoubleTick. Accepted/enqueued: '+(d.summary.enqueued??d.summary.sent)+', failed: '+d.summary.failed+'. Final delivery updates arrive through the DoubleTick webhook.</div>';await historyPage()}catch(e){alert(e.message);let b=$('sendpanel').querySelector('button[onclick*="sendNow"]');if(b){b.disabled=false;b.textContent='Send approved template'}}}
let uploadedTemplateMediaUrl='';
async function apiForm(path,fd){let r=await fetch('/api'+path,{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error||'Upload failed');return d}
async function uploadTemplateImage(input){const file=input.files?.[0];if(!file)return;if(!['image/jpeg','image/png'].includes(file.type))return alert('Please choose a JPG or PNG image.');if(file.size>5*1024*1024)return alert('Image must be 5 MB or smaller.');try{const fd=new FormData();fd.append('file',file);const d=await apiForm('/templates/upload-image',fd);uploadedTemplateMediaUrl=d.media_url;$('theader').value='';$('timageStatus').textContent='Uploaded to DoubleTick: '+file.name+' (submit template within 24 hours).';}catch(e){uploadedTemplateMediaUrl='';$('timageStatus').textContent='Upload failed: '+e.message;alert(e.message)}}
async function analyticsPage(){
 $('view').innerHTML=`<div class="heading"><div><h1>Daily WhatsApp Analytics</h1><div class="muted">Daily incoming and outgoing message counts · India time (IST)</div></div><div class="row"><select id="analyticsDays" onchange="loadAnalytics()" style="border:1px solid #d6dce6;border-radius:8px;padding:10px"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select><button class="btn secondary" onclick="loadAnalytics()">↻ Refresh</button></div></div><div id="analyticsContent"><div class="card muted">Loading analytics…</div></div>`;
 await loadAnalytics();
}
async function loadAnalytics(){
 const host=$('analyticsContent');if(!host)return;host.innerHTML='<div class="card muted">Loading analytics…</div>';
 try{
  const days=Number($('analyticsDays')?.value||30),d=await api('/analytics?days='+days),s=d.summary||{};
  const max=Math.max(1,...(d.daily||[]).map(x=>Number(x.total||0)));
  const bars=(d.daily||[]).map(x=>{const pct=Math.max(2,Math.round(Number(x.total||0)/max*100));const label=x.date.slice(5);return `<div title="${esc(x.date)}: ${x.total} total · ${x.incoming} incoming · ${x.outgoing} outgoing" style="flex:1;min-width:5px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:190px"><div style="font-size:10px;color:#64748b;margin-bottom:4px">${x.total||''}</div><div style="width:100%;max-width:24px;height:${pct}%;min-height:${x.total?4:1}px;background:#2563eb;border-radius:5px 5px 0 0"></div><div style="font-size:9px;color:#64748b;margin-top:6px;white-space:nowrap;transform:rotate(-45deg);transform-origin:top center">${label}</div></div>`}).join('');
  const dailyRows=(d.daily||[]).slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${x.incoming}</td><td>${x.outgoing}</td><td><b>${x.total}</b></td><td>${x.failed||0}</td></tr>`).join('');
  const userRows=(d.users||[]).map(x=>`<tr><td>${esc(x.username)}</td><td>${x.incoming}</td><td>${x.outgoing}</td><td><b>${x.total}</b></td><td>${x.failed||0}</td></tr>`).join('');
  host.innerHTML=`<div class="stats"><div class="stat"><span class="muted small">Total messages</span><b>${s.total||0}</b></div><div class="stat"><span class="muted small">Incoming messages</span><b>${s.incoming||0}</b></div><div class="stat"><span class="muted small">Outgoing messages</span><b>${s.outgoing||0}</b></div><div class="stat"><span class="muted small">Failed outgoing attempts</span><b>${s.failed||0}</b></div></div><div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Messages per day</h3><span class="small muted">${esc(d.from)} to ${esc(d.to)} · IST</span></div><div style="display:flex;align-items:flex-end;gap:5px;height:230px;padding:18px 4px 28px;overflow-x:auto;border-bottom:1px solid #e5e7eb">${bars}</div><div class="row small muted" style="margin-top:12px"><span><i style="display:inline-block;width:10px;height:10px;background:#2563eb;border-radius:2px;margin-right:5px"></i>Total messages per day</span></div></div>${me.role==='admin'?`<div class="card"><h3>HR-wise performance</h3><div class="tablewrap"><table><thead><tr><th>HR User</th><th>Incoming</th><th>Outgoing</th><th>Total</th><th>Failed</th></tr></thead><tbody>${userRows||'<tr><td colspan="5">No activity in this period.</td></tr>'}</tbody></table></div><div class="small muted" style="margin-top:8px">Unassigned incoming messages are shown separately when present.</div></div>`:''}<div class="card"><h3>Daily breakdown</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Incoming</th><th>Outgoing</th><th>Total</th><th>Failed attempts</th></tr></thead><tbody>${dailyRows||'<tr><td colspan="5">No messages in this period.</td></tr>'}</tbody></table></div></div><div class="small muted">Counts include campaign/template send attempts from Message History and incoming/reply messages saved in WhatsApp Chats. Failed counts are failed outgoing attempts, not failed incoming messages.</div>`;
 }catch(e){host.innerHTML=`<div class="alert">Could not load analytics: ${esc(e.message)}</div>`}
}
async function templatesPage(){try{await api('/templates/refresh-status',{method:'POST'})}catch(e){console.warn('DoubleTick template refresh:',e.message)}let a=await api('/templates');renderTemplates(a)}function renderTemplates(a){$('view').innerHTML=`<div class="heading"><div><h1>WhatsApp Templates</h1><div class="muted">Create a template here, submit it to DoubleTick for WhatsApp approval, then send only after approval.</div></div><button class="btn secondary" onclick="refreshTemplateStatuses()">↻ Refresh approval status</button></div><div class="card"><h3>Create WhatsApp template</h3><div class="grid"><div class="field"><label>Template display name</label><input id="tname" placeholder="Doctor Vacancy Alert"></div><div class="field"><label>DoubleTick template name (unique)</label><input id="tapproved" placeholder="doctor_vacancy_alert"></div><div class="field"><label>Language</label><select id="tlang"><option value="en">English (en)</option><option value="hi">Hindi (hi)</option></select></div><div class="field"><label>Category</label><select id="tcategory"><option value="MARKETING">Marketing</option><option value="UTILITY">Utility</option></select></div><div class="field"><label>Text header (optional, max 60 chars)</label><input id="theader" maxlength="60" placeholder="New Doctor Vacancy" oninput="if(this.value)uploadedTemplateMediaUrl=''"></div><div class="field"><label>Footer (optional, max 60 chars)</label><input id="tfooter" maxlength="60" placeholder="Space Consultant"></div></div><div class="field"><label>Image header (optional — JPG/PNG, max 5 MB)</label><input id="timage" type="file" accept="image/png,image/jpeg" onchange="uploadTemplateImage(this)"><div id="timageStatus" class="small muted">No image uploaded. Use either text header or image header.</div></div><div class="field"><label>Body (max 1024 chars)</label><textarea id="tcontent" maxlength="1024" placeholder="Hello {{1}}, we have an opening for {{2}} in {{3}}. Reply if interested."></textarea></div><div class="muted small">WhatsApp template placeholders use {{1}}, {{2}}, {{3}} in order. Use the same order when configuring the message variables for sending. Approval is decided by WhatsApp/Meta, not instantly by this dashboard.</div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="saveTemplatePage()">Save draft</button><button class="btn" onclick="saveAndSubmitTemplate()">Save & submit for approval</button></div><div class="alert">Required backend variables: DOUBLETICK_API_KEY and DOUBLETICK_WABA_NUMBER. Never enter API keys in this page.</div></div><div class="card"><h3>My templates and drafts</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>Template name</th><th>Language</th><th>Category</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${a.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.template_name||'—')}</td><td>${esc(t.language||'en')}</td><td>${esc(t.category||'—')}</td><td><span class="pill">${esc(t.approval_status||'DRAFT')}</span></td><td>${esc(t.created_at)}</td><td class="row">${(t.approval_status==='DRAFT'||t.approval_status==='REJECTED')?`<button class="btn" onclick="submitSavedTemplate(${t.id})">Submit</button>`:''}${t.approval_status==='APPROVED'?'<span class="muted small">Ready to send from Candidate Search</span>':''}<button class="btn danger" onclick="deleteTemplate(${t.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No templates yet.</td></tr>'}</tbody></table></div></div>`}
async function templatePayload(){return {header_media_url:uploadedTemplateMediaUrl, name:$('tname').value.trim(),kind:'custom',content:$('tcontent').value.trim(),template_name:$('tapproved').value.trim(),language:$('tlang').value,category:$('tcategory').value,header_text:$('theader').value.trim(),footer_text:$('tfooter').value.trim()}}
async function saveTemplatePage(){try{let p=await templatePayload();await api('/templates',{method:'POST',body:JSON.stringify(p)});alert('Draft saved.');uploadedTemplateMediaUrl='';templatesPage()}catch(e){alert(e.message)}}
async function saveAndSubmitTemplate(){try{let p=await templatePayload();if(!p.name||!p.content)return alert('Display name and body are required.');await api('/templates',{method:'POST',body:JSON.stringify(p)});let all=await api('/templates');let t=all.find(x=>x.name===p.name&&x.content===p.content&&x.approval_status==='DRAFT');if(!t)throw new Error('Draft saved, but could not find it for submission. Open My Templates and submit it there.');let r=await api('/templates/'+t.id+'/submit',{method:'POST'});alert('Submitted to DoubleTick. Current status: '+r.status);uploadedTemplateMediaUrl='';templatesPage()}catch(e){alert(e.message)}}
async function submitSavedTemplate(id){if(!confirm('Submit this template to DoubleTick for WhatsApp approval?'))return;try{let r=await api('/templates/'+id+'/submit',{method:'POST'});alert('Submitted. Status: '+r.status);templatesPage()}catch(e){alert(e.message)}}
async function refreshTemplateStatuses(){try{let r=await api('/templates/refresh-status',{method:'POST'});alert(r.message+' Updated: '+r.updated+'; statuses: '+JSON.stringify(r.statuses||{}));let a=await api('/templates');renderTemplates(a)}catch(e){alert(e.message)}}
async function deleteTemplate(id){if(confirm('Delete this template?')){await api('/templates/'+id,{method:'DELETE'});templatesPage()}}
async function chatsPage(){
 if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null}
 let a=await api('/chats');
 $('view').innerHTML=`<div class="heading"><div><h1>WhatsApp Chats</h1><div class="muted">Live candidate conversations. Replies refresh automatically.</div></div><button class="btn secondary" onclick="refreshChats()">↻ Refresh</button></div><div class="card"><div class="grid" style="grid-template-columns:280px 1fr;align-items:start"><div><div class="field"><label>Search candidate / mobile</label><input id="chatSearch" placeholder="Search…" oninput="filterChatList()"></div><div id="chatlist" style="max-height:70vh;overflow:auto">${chatListHtml(a)}</div></div><div id="chatdetail" class="muted">Select a candidate to open conversation.</div></div></div>`;
 chatRefreshTimer=setInterval(()=>refreshChats().catch(e=>console.warn(e)),10000);
}
async function refreshChats(){
 const a=await api('/chats'),list=$('chatlist');
 if(list){list.innerHTML=chatListHtml(a);filterChatList()}
 if(activeChatPhone && $('chatdetail')) await renderChat(activeChatPhone,activeChatName);
}
function chatListHtml(a){return a.map(x=>`<div class="nav chatitem ${Number(x.unread_count||0)>0?'unread-chat':''}" style="border-bottom:1px solid #edf0f4;cursor:pointer" data-phone="${esc(x.phone)}" data-search="${esc((x.candidate_name||'')+' '+(x.phone||'')).toLowerCase()}" onclick="openChat('${esc(x.phone)}','${esc(x.candidate_name||x.phone)}')"><b>${esc(x.candidate_name||x.phone)}</b>${Number(x.unread_count||0)>0?`<span class="unread-badge">NEW REPLY · ${Number(x.unread_count)}</span>`:''}<div class="small muted">${esc(x.phone)} · ${x.message_count||0} messages</div><div class="small muted">${esc(x.last_at||'')}</div></div>`).join('')||'<p class="muted">No conversations yet. Confirm DoubleTick MESSAGE_RECEIVED webhook configuration.</p>'}
function filterChatList(){let q=($('chatSearch')?.value||'').toLowerCase();document.querySelectorAll('.chatitem').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}
async function openChat(phone,name){activeChatPhone=phone;activeChatName=name;await renderChat(phone,name)}
async function renderChat(phone,name){
 // Preserve the unsent draft while the 10-second inbox refresh updates the conversation.
 const oldField=$('chatReplyText');
 const draft=oldField ? oldField.value : '';
 const wasFocused=oldField ? document.activeElement===oldField : false;
 const selectionStart=oldField && typeof oldField.selectionStart==='number' ? oldField.selectionStart : draft.length;
 const selectionEnd=oldField && typeof oldField.selectionEnd==='number' ? oldField.selectionEnd : draft.length;
 try{await api('/chats/'+encodeURIComponent(phone)+'/read',{method:'POST'})}catch(e){console.warn('Mark read:',e.message)}\n let a=await api('/chats/'+encodeURIComponent(phone)),box=$('chatdetail');if(!box)return;
 box.innerHTML=`<div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(name)}</h3><div class="muted small">${esc(phone)}</div></div><button class="btn secondary" onclick="renderChat('${esc(phone)}','${esc(name)}')">↻</button></div><div id="chatmessages" style="height:52vh;overflow:auto;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:12px">${a.map(x=>`<div style="display:flex;justify-content:${x.direction==='IN'?'flex-start':'flex-end'};margin:9px 0"><div style="max-width:78%;padding:10px 13px;border-radius:12px;background:${x.direction==='IN'?'#fff':'#dbeafe'};border:1px solid #e5e7eb"><div class="small muted">${x.direction==='IN'?'Candidate':'You'} · ${esc(x.created_at||'')}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.content||'['+(x.message_type||'MESSAGE')+']')}</div>${x.media_url?`<a target="_blank" rel="noopener" href="${esc(x.media_url)}">Open ${esc(x.message_type||'media')}</a>`:''}${x.status?`<div class="small muted">${esc(x.status)}</div>`:''}</div></div>`).join('')||'<p class="muted">No messages saved for this candidate yet. Incoming messages appear after DoubleTick sends the MESSAGE_RECEIVED webhook.</p>'}</div><div style="display:flex;gap:8px;margin-top:10px"><textarea id="chatReplyText" rows="2" maxlength="4000" placeholder="Type a WhatsApp reply…" style="flex:1;resize:vertical;border:1px solid #d6dce6;border-radius:9px;padding:11px;font:inherit" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatReply()}"></textarea><button class="btn" id="chatSendBtn" onclick="sendChatReply()">Send</button></div><div class="small muted" style="margin-top:7px">Free-form text replies work only within WhatsApp's 24-hour customer service window after the candidate's last message. Outside that window, send an approved template.</div><div class="internal-notes"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Internal Notes (Admin / HR only)</h3><span class="small muted">Not sent to WhatsApp</span></div><textarea id="internalNoteText" rows="2" maxlength="3000" placeholder="Example: Candidate se baat ho gayi; salary discuss kar li." style="width:100%;margin-top:9px;box-sizing:border-box;border:1px solid #d6dce6;border-radius:8px;padding:10px;font:inherit"></textarea><div class="row" style="justify-content:flex-end;margin-top:7px"><button class="btn secondary" onclick="saveInternalNote()">Save internal note</button></div><div id="internalNotesList" class="small muted" style="margin-top:10px">Loading notes…</div></div>`;\n loadInternalNotes(phone);
 const newField=$('chatReplyText');
 if(newField){
   newField.value=draft;
   if(wasFocused){newField.focus();try{newField.setSelectionRange(selectionStart,selectionEnd)}catch(_){}}
 }
 let m=$('chatmessages');m.scrollTop=m.scrollHeight;
}
async function loadInternalNotes(phone){
 const host=$('internalNotesList');if(!host)return;
 try{const notes=await api('/chats/'+encodeURIComponent(phone)+'/notes');
 host.innerHTML=notes.length?notes.map(n=>`<div class="internal-note"><div style="white-space:pre-wrap;color:#111827">${esc(n.note)}</div><div class="small muted" style="margin-top:5px">${esc(n.username||'User')} · ${esc(n.created_at||'')}</div></div>`).join(''):'No internal notes yet.';
 }catch(e){host.textContent='Could not load notes: '+e.message;}
}
async function saveInternalNote(){
 const field=$('internalNoteText');if(!field||!activeChatPhone)return;
 const note=field.value.trim();if(!note)return alert('Please write a note first.');
 try{await api('/chats/'+encodeURIComponent(activeChatPhone)+'/notes',{method:'POST',body:JSON.stringify({note})});field.value='';await loadInternalNotes(activeChatPhone);}
 catch(e){alert(e.message)}
}
async function sendChatReply(){
 const field=$('chatReplyText'),btn=$('chatSendBtn');if(!field||!activeChatPhone)return;
 const message=field.value.trim();if(!message)return;
 btn.disabled=true;btn.textContent='Sending…';
 try{await api('/chats/'+encodeURIComponent(activeChatPhone)+'/reply',{method:'POST',body:JSON.stringify({message})});field.value='';await renderChat(activeChatPhone,activeChatName);await refreshChats()}
 catch(e){alert(e.message)}
 finally{if($('chatSendBtn')){$('chatSendBtn').disabled=false;$('chatSendBtn').textContent='Send'}}
}
async function historyPage(){await refreshHistoryTable();historyTimer=setInterval(()=>refreshHistoryTable().catch(e=>console.warn(e)),12000)}
async function refreshHistoryTable(){let a=await api('/history');let view=$('view');if(!view)return;let existing=view.querySelector('#historybody');if(!existing){view.innerHTML=`<div class="heading"><div><h1>Message History</h1><div class="muted">${me.role==='admin'?'All HR users':'Your'} recent sending activity. Status auto-refreshes every 12 seconds.</div></div><button class="btn secondary" onclick="refreshHistoryTable()">↻ Refresh status</button></div><div class="card"><div class="tablewrap"><table><thead><tr>${me.role==='admin'?'<th>HR User</th>':''}<th>Candidate</th>${me.role==='admin'?'<th>Phone</th>':''}<th>Type</th><th>Template</th><th>Status</th><th>Date</th><th>Details</th></tr></thead><tbody id="historybody"></tbody></table></div></div>`;existing=view.querySelector('#historybody')}existing.innerHTML=a.map(x=>{let st=String(x.status||'UNKNOWN').toUpperCase();let colors={READ:['#dcfce7','#166534'],DELIVERED:['#dcfce7','#166534'],SENT:['#dbeafe','#1d4ed8'],ENQUEUED:['#fef3c7','#92400e'],PROCESSING:['#fef3c7','#92400e'],FAILED:['#fee2e2','#991b1b'],UNKNOWN:['#e5e7eb','#374151']};let color=colors[st]||colors.UNKNOWN;return `<tr>${me.role==='admin'?'<td>'+esc(x.username)+'</td>':''}<td>${esc(x.candidate_name)}</td>${me.role==='admin'?'<td>'+esc(x.phone)+'</td>':''}<td>${esc(x.kind)}</td><td>${esc(x.template_name)}</td><td><span class="pill" style="background:${color[0]};color:${color[1]}">${esc(st)}</span></td><td>${esc(x.created_at)}</td><td title="${esc(x.detail)}">${esc((x.detail||'').slice(0,90))}</td></tr>`}).join('')||'<tr><td colspan="8">No message history yet.</td></tr>'}
async function usersPage(){let a=await api('/admin/users');$('view').innerHTML=`<div class="heading"><div><h1>HR User Management</h1><div class="muted">Create and manage individual HR accounts.</div></div></div><div class="card"><h3>Create HR user</h3><div class="grid"><div class="field"><label>Username</label><input id="newuser" placeholder="hr_name"></div><div class="field"><label>Password (min. 8 characters)</label><input id="newpass" type="password"></div><div class="field" style="justify-content:end"><button class="btn" onclick="createUser()">Create user</button></div></div></div><div class="card"><h3>HR accounts</h3><div class="tablewrap"><table><thead><tr><th>Username</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.username)}</td><td>${x.active?'Active':'Inactive'}</td><td>${esc(x.created_at)}</td><td class="row"><button class="btn secondary" onclick="resetPass(${x.id})">Reset password</button><button class="btn ${x.active?'danger':'secondary'}" onclick="toggleUser(${x.id},${!x.active})">${x.active?'Deactivate':'Activate'}</button></td></tr>`).join('')||'<tr><td colspan="4">No HR users.</td></tr>'}</tbody></table></div></div>`}async function createUser(){try{await api('/admin/users',{method:'POST',body:JSON.stringify({username:$('newuser').value,password:$('newpass').value})});usersPage()}catch(e){alert(e.message)}}async function resetPass(id){let p=prompt('Enter new password (minimum 8 characters):');if(p===null)return;try{await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({password:p})});alert('Password updated.')}catch(e){alert(e.message)}}async function toggleUser(id,active){try{await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({active})});usersPage()}catch(e){alert(e.message)}}
async function passwordPage(){$('view').innerHTML=`<div class="heading"><div><h1>Change Admin Password</h1><div class="muted">Update your own administrator login password.</div></div></div><div class="card" style="max-width:620px"><div class="field"><label>Current password</label><input id="adminCurrentPassword" type="password" autocomplete="current-password" placeholder="Enter current password"></div><div class="field"><label>New password (minimum 8 characters)</label><input id="adminNewPassword" type="password" autocomplete="new-password" placeholder="Enter new password"></div><div class="field"><label>Confirm new password</label><input id="adminConfirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter new password"></div><button class="btn" onclick="changeAdminPassword()">Update password</button><p id="passwordStatus" class="muted small" style="margin-top:12px"></p></div>`}async function changeAdminPassword(){const current=$('adminCurrentPassword').value,next=$('adminNewPassword').value,confirmNext=$('adminConfirmPassword').value,status=$('passwordStatus');status.textContent='';if(!current||!next||!confirmNext){status.textContent='Please fill in all password fields.';return}if(next.length<8){status.textContent='New password must be at least 8 characters.';return}if(next!==confirmNext){status.textContent='New password and confirmation do not match.';return}try{const d=await api('/me/change-password',{method:'POST',body:JSON.stringify({current_password:current,new_password:next})});status.textContent=d.message; $('adminCurrentPassword').value='';$('adminNewPassword').value='';$('adminConfirmPassword').value='';}catch(e){status.textContent=e.message}}
async function settingsPage(){let c=await api('/admin/config');$('view').innerHTML=`<div class="heading"><div><h1>Airtable Settings</h1><div class="muted">Add multiple Airtable candidate views. Records from all links are combined for HR users.</div></div></div><div class="card"><div class="field"><label>Airtable shared view / direct view URLs (one URL per line)</label><textarea id="airurls" placeholder="https://airtable.com/...">${esc(c.airtable_urls.join('\n'))}</textarea></div><div class="field"><label>Maximum WhatsApp message attempts per HR user per day</label><input id="hrlimit" type="number" min="1" max="5000" value="${esc(c.max_messages_per_user_per_day)}" /></div><div class="muted small">HR users cannot see candidate mobile numbers. Each HR account is limited to this many message attempts per India calendar day. Failed attempts also count to prevent repeated retries.</div><div style="margin-top:15px"><button class="btn" onclick="saveAir()">Save settings</button></div><div class="alert" style="margin-top:16px">Airtable token and DoubleTick proxy credentials must be configured as backend environment variables. Never paste API secrets into this dashboard.</div></div>`}async function saveAir(){try{await api('/admin/config',{method:'PUT',body:JSON.stringify({urls:$('airurls').value.split('\n').map(x=>x.trim()).filter(Boolean),max_messages_per_user_per_day:Number($('hrlimit').value)})});alert('Settings saved.');settingsPage()}catch(e){alert(e.message)}}
if(token)boot();
</script></body></html>
