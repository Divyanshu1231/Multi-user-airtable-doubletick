<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Consultant | Recruitment Desk</title><style>
:root{--navy:#14243b;--blue:#2563eb;--bg:#f4f6fa;--line:#e4e8ef;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,system-ui,Segoe UI,Arial;color:#172033}.hidden{display:none!important}.shell{min-height:100vh}.top{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.brand{font-weight:750;font-size:17px}.brand span{color:#9db9ff}.top small{color:#cbd5e1}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:220px;background:#fff;border-right:1px solid var(--line);padding:22px 14px}.nav{padding:11px 13px;border-radius:9px;margin:4px 0;color:#475569;cursor:pointer}.nav.active,.nav:hover{background:#edf3ff;color:#1d4ed8}.main{padding:28px;width:100%;max-width:1500px;margin:0 auto}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.heading h1{font-size:23px;margin:0}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #15243b08}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#526176;font-weight:650}.field input,.field select,.field textarea{border:1px solid #d6dce6;border-radius:8px;padding:10px 11px;font:inherit;background:white;min-width:0}.field textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:8px;padding:10px 15px;background:var(--blue);color:white;font-weight:650;cursor:pointer}.btn.secondary{background:#eef2f7;color:#334155}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:#64748b;background:#fafbfc;font-weight:650}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#eff6ff;color:#1d4ed8;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:10px}.stat b{display:block;font-size:23px}.alert{padding:11px 13px;border-radius:8px;background:#fff7ed;color:#9a3412;margin:12px 0}.success{background:#ecfdf5;color:#166534}.login{max-width:420px;margin:9vh auto}.login .card{padding:28px}.login h1{font-size:23px;margin-top:0}.small{font-size:12px}.right{margin-left:auto}.templatepreview{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);padding:14px;border-radius:9px;min-height:80px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:8px 12px;border-radius:8px;background:#f1f5f9;cursor:pointer}.tab.active{background:#dbeafe;color:#1d4ed8}@media(max-width:800px){.layout{display:block}aside{width:auto;display:flex;gap:6px;overflow:auto;padding:9px}.nav{white-space:nowrap}.main{padding:16px}.grid,.stats{grid-template-columns:1fr}.top{padding:0 15px}}
</style></head><body><div id="login" class="login"><div class="card"><div class="brand" style="color:#14243b">SPACE <span>CONSULTANT</span></div><p class="muted">Recruitment Messaging Desk</p><h1>Sign in</h1><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">Login</button><p id="loginerr" class="muted small"></p></div></div>
<div id="app" class="shell hidden"><header class="top"><div class="brand">SPACE <span>CONSULTANT</span> <small> / Recruitment Desk</small></div><div class="row"><small id="who"></small><button class="btn secondary" onclick="logout()">Logout</button></div></header><div class="layout"><aside id="sidebar"><div class="nav active" data-page="dashboard" onclick="page('dashboard')">Dashboard</div><div class="nav" data-page="templates" onclick="page('templates')">My Templates</div><div class="nav" data-page="chats" onclick="page('chats')">WhatsApp Chats</div><div class="nav" data-page="history" onclick="page('history')">Message History</div><div id="adminnav" class="hidden"><hr style="border:0;border-top:1px solid #e5e7eb"><div class="nav" data-page="users" onclick="page('users')">HR User Management</div><div class="nav" data-page="settings" onclick="page('settings')">Airtable Settings</div></div></aside><main class="main"><div id="view"></div></main></div></div>
<script>
let token=localStorage.getItem('sc_token')||'', me=null, candidateCache=[], currentOptions={}, historyTimer=null;const $=id=>document.getElementById(id);const api=async(path,opts={})=>{let r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opts.headers}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error||'Request failed');return d};const apiForm=async(path,form)=>{let r=await fetch('/api'+path,{method:'POST',headers:{'Authorization':'Bearer '+token},body:form});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error||'Request failed');return d};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function logout(){localStorage.removeItem('sc_token');location.reload()}async function login(){ $('loginerr').textContent='';try{let d=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})}).then(r=>r.json().then(x=>{if(!r.ok)throw Error(x.detail);return x}));token=d.token;localStorage.setItem('sc_token',token);await boot()}catch(e){$('loginerr').textContent=e.message}}
async function boot(){try{me=await api('/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.username+' · '+me.role.toUpperCase();$('adminnav').classList.toggle('hidden',me.role!=='admin');page('dashboard')}catch(e){token='';localStorage.removeItem('sc_token');$('login').classList.remove('hidden')}}function page(p){if(historyTimer){clearInterval(historyTimer);historyTimer=null}if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null}document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));({dashboard:dashboard,templates:templatesPage,chats:chatsPage,history:historyPage,users:usersPage,settings:settingsPage}[p]||dashboard)().catch(err=>showError(err.message))}function showError(s){$('view').innerHTML='<div class="alert">'+esc(s)+'</div>'}
async function dashboard(){ $('view').innerHTML=`<div class="heading"><div><h1>Candidate Search</h1><div class="muted">Filter Airtable candidates and send recruitment messages.</div></div><button class="btn secondary" onclick="loadCandidates(true)">↻ Refresh</button></div><div class="card"><div class="grid"><div class="field"><label>Specialization</label><select id="spec" onchange="filterCandidatesLocal()"><option value="">All specializations</option></select></div><div class="field"><label>State</label><select id="state" onchange="filterCandidatesLocal()"><option value="">All states</option></select></div><div class="field"><label>City</label><select id="city" onchange="filterCandidatesLocal()"><option value="">All cities</option></select></div></div><div class="row"><span class="muted" id="candidatecount">Loading candidates…</span><button class="btn secondary" onclick="selectAll(true)">Select all</button><button class="btn secondary" onclick="selectAll(false)">Clear selection</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th><input type="checkbox" onchange="selectAll(this.checked)"></th><th>Candidate</th><th>Specialization</th><th>State</th><th>City</th></tr></thead><tbody id="candidatebody"><tr><td colspan="5">Loading…</td></tr></tbody></table></div><div class="row" style="margin-top:16px"><span id="selectedcount" class="muted">0 selected</span><button class="btn right" onclick="openSend()">Create message & send</button></div></div><div id="sendpanel"></div>`;await loadCandidates()}
async function loadCandidates(forceRefresh=false){
  const count=$('candidatecount'), body=$('candidatebody');
  if(count)count.textContent=forceRefresh?'Refreshing Airtable candidates…':'Loading candidates…';
  if(body)body.innerHTML='<tr><td colspan="5" class="muted">Loading candidates…</td></tr>';
  try{
    const d=await api('/candidates'+(forceRefresh?'?refresh=true':''));
    candidateCache=d.candidates||[]; currentOptions=d.options||{};
    [['spec','specializations','All specializations'],['state','states','All states'],['city','cities','All cities']].forEach(([id,key,label])=>{
      const el=$(id); if(!el)return; const previous=el.value; const vals=currentOptions[key]||[];
      el.innerHTML='<option value="">'+label+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
      if(vals.includes(previous))el.value=previous;
    });
    filterCandidatesLocal();
  }catch(e){
    if(count)count.textContent='Could not load candidates';
    if(body)body.innerHTML='<tr><td colspan="5"><div class="alert">'+esc(e.message)+'<br><button class="btn secondary" style="margin-top:8px" onclick="loadCandidates(true)">Try again</button></div></td></tr>';
  }
}
function filterCandidatesLocal(){
  const spec=($('spec')?.value||'').trim().toLocaleLowerCase();
  const state=($('state')?.value||'').trim().toLocaleLowerCase();
  const city=($('city')?.value||'').trim().toLocaleLowerCase();
  const filtered=candidateCache.filter(c=>{
    const has=(arr,want)=>!want||(arr||[]).some(v=>String(v).trim().toLocaleLowerCase()===want);
    return has(c.specialization,spec)&&has(c.state,state)&&has(c.city,city);
  });
  $('candidatecount').textContent=filtered.length+' candidates found';
  $('candidatebody').innerHTML=filtered.map(c=>`<tr><td><input class="candidatecheck" type="checkbox" value="${esc(c.id)}" onchange="updateSelected()"></td><td><b>${esc(c.name||'Unnamed')}</b></td><td>${esc((c.specialization||[]).join(', '))}</td><td>${esc((c.state||[]).join(', '))}</td><td>${esc((c.city||[]).join(', '))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No matching candidates for the selected filters.</td></tr>';
  updateSelected();
}
function selectAll(v){document.querySelectorAll('.candidatecheck').forEach(x=>x.checked=v);updateSelected()}function selected(){return [...document.querySelectorAll('.candidatecheck:checked')].map(x=>x.value)}function updateSelected(){if($('selectedcount'))$('selectedcount').textContent=selected().length+' selected'}
async function openSend(){if(!selected().length)return alert('Select at least one candidate first.');try{await api('/templates/refresh-status',{method:'POST'})}catch(e){console.warn('Template status refresh:',e.message)}let ts=await api('/templates');$('sendpanel').innerHTML=`<div class="card"><h3>Compose WhatsApp message</h3><div class="tabs"><div class="tab active" onclick="sendTab('approved',this)">Approved DoubleTick template</div><div class="tab" onclick="sendTab('custom',this)">Custom draft</div></div><div id="approvedform"><div class="field"><label>Saved approved template (only approved templates appear)</label><select id="savedApproved" onchange="useSavedApproved()"><option value="">Choose saved template (optional)</option>${ts.filter(t=>t.approval_status==='APPROVED').map(t=>`<option value="${esc(t.template_name)}">${esc(t.name)} — ${esc(t.template_name)} (${esc(t.language||'en')})</option>`).join('')}</select></div><div class="grid"><div class="field"><label>Approved DoubleTick template name</label><input id="templateName" placeholder="e.g. approved_template_name"></div><div class="field"><label>Template language</label><select id="templateLanguage"><option value="en">English (en)</option><option value="hi">Hindi (hi)</option></select></div></div><div class="field"><label>Optional preview / notes</label><textarea id="approvedPreview" placeholder="Hello {{name}}, we have an opening for {{specialization}} in {{city}}..."></textarea></div><div class="muted small">The template name must already be approved for your WhatsApp Business account. Placeholder order must match the configuration in your proxy integration.</div><button class="btn" onclick="sendNow('approved')">Send approved template to ${selected().length} candidates</button></div><div id="customform" class="hidden"><div class="field"><label>Draft message</label><textarea id="customMessage" oninput="previewCustom()" placeholder="Hello {{name}}, we have an opening for {{specialization}} in {{city}}."></textarea></div><div class="muted small">Variables: {{name}}, {{specialization}}, {{state}}, {{city}}</div><div class="templatepreview" id="customPreview">Preview appears here…</div><div class="alert">Custom drafts can be saved and previewed. The supplied proxy only sends approved templates; free-form WhatsApp sending requires a separate verified text endpoint and is subject to the 24-hour messaging window.</div><button class="btn secondary" onclick="saveCustomDraft()">Save custom draft</button></div></div>`;$('sendpanel').scrollIntoView({behavior:'smooth'})}
function useSavedApproved(){let x=$('savedApproved')?.value;if(x)$('templateName').value=x}function sendTab(t,el){document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');$('approvedform').classList.toggle('hidden',t!=='approved');$('customform').classList.toggle('hidden',t!=='custom')}function previewCustom(){let c=candidateCache.find(x=>selected().includes(x.id));let s=$('customMessage').value;for(let [k,v] of Object.entries({name:c?.name||'Candidate',specialization:c?.specialization.join(', ')||'Specialization',state:c?.state.join(', ')||'State',city:c?.city.join(', ')||'City'}))s=s.replaceAll('{{'+k+'}}',v);$('customPreview').textContent=s||'Preview appears here…'}async function saveCustomDraft(){let name=prompt('Give this draft a name:');if(!name)return;try{await api('/templates',{method:'POST',body:JSON.stringify({name,kind:'custom',content:$('customMessage').value})});alert('Draft saved in My Templates.')}catch(e){alert(e.message)}}async function sendNow(kind){if(kind!=='approved')return;let name=$('templateName').value.trim();if(!name)return alert('Enter approved template name');if(!confirm('Send '+name+' to '+selected().length+' selected candidates?'))return;try{let b=$('sendpanel').querySelector('button[onclick*="sendNow"]');b.disabled=true;b.textContent='Sending…';let d=await api('/send',{method:'POST',body:JSON.stringify({candidate_ids:selected(),kind:'approved',template_name:name,language:$('templateLanguage')?.value||'en'})});alert(`Submitted to DoubleTick. Accepted/enqueued: ${d.summary.enqueued??d.summary.sent}, Failed: ${d.summary.failed}. Delivery status will update in Message History.`);$('sendpanel').innerHTML='<div class="card success">Submitted to DoubleTick. Accepted/enqueued: '+(d.summary.enqueued??d.summary.sent)+', failed: '+d.summary.failed+'. Final delivery updates arrive through the DoubleTick webhook.</div>';await historyPage()}catch(e){alert(e.message);let b=$('sendpanel').querySelector('button[onclick*="sendNow"]');if(b){b.disabled=false;b.textContent='Send approved template'}}}
async function templatesPage(){try{await api('/templates/refresh-status',{method:'POST'})}catch(e){console.warn('DoubleTick template refresh:',e.message)}let a=await api('/templates');renderTemplates(a)}let uploadedTemplateMediaUrl='',csvPreviewColumns=[],csvPreviewCount=0,approvedTemplateRows=[];
function renderTemplates(a){
 approvedTemplateRows=a.filter(t=>String(t.approval_status||'').toUpperCase()==='APPROVED');
 $('view').innerHTML=`<div class="heading"><div><h1>WhatsApp Templates</h1><div class="muted">Create a template, optionally add an image header, submit for WhatsApp approval, then send to candidates.</div></div><button class="btn secondary" onclick="refreshTemplateStatuses()">↻ Refresh approval status</button></div>
 <div class="card"><h3>Create WhatsApp template</h3>
 <div class="grid"><div class="field"><label>Template display name</label><input id="tname" placeholder="Doctor Vacancy Alert"></div><div class="field"><label>DoubleTick template name (unique)</label><input id="tapproved" placeholder="doctor_vacancy_alert"></div><div class="field"><label>Language</label><select id="tlang"><option value="en">English (en)</option><option value="hi">Hindi (hi)</option></select></div><div class="field"><label>Category</label><select id="tcategory"><option value="MARKETING">Marketing</option><option value="UTILITY">Utility</option></select></div><div class="field"><label>Text header (optional, max 60 chars)</label><input id="theader" maxlength="60" placeholder="New Doctor Vacancy" oninput="if(this.value)uploadedTemplateMediaUrl=''"></div><div class="field"><label>Footer (optional, max 60 chars)</label><input id="tfooter" maxlength="60" placeholder="Space Consultant"></div></div>
 <div class="field"><label>Image header (optional — JPG/PNG, max 5 MB)</label><input id="timage" type="file" accept="image/png,image/jpeg" onchange="uploadTemplateImage(this)"><div id="timageStatus" class="small muted">No image uploaded. Use either text header or image header.</div></div>
 <div class="field"><label>Body (max 1024 chars)</label><textarea id="tcontent" maxlength="1024" placeholder="Hello {{1}}, we have an opening for {{2}} in {{3}}. Reply if interested."></textarea></div>
 <div class="muted small">Template placeholders use {{1}}, {{2}}, {{3}} in order. Approval is decided by WhatsApp/Meta, not instantly by this dashboard. DoubleTick media upload links may expire after 24 hours, so submit the draft soon after uploading the image.</div>
 <div class="row" style="margin-top:14px"><button class="btn secondary" onclick="saveTemplatePage()">Save draft</button><button class="btn" onclick="saveAndSubmitTemplate()">Save & submit for approval</button></div>
 <div class="alert">Required backend variables: DOUBLETICK_API_KEY and DOUBLETICK_WABA_NUMBER. Image upload is performed by the backend; never enter API keys on this page.</div></div>
 <div class="card"><h3>Send approved template to Airtable CSV</h3><p class="muted">Upload an Airtable CSV export, map its name/mobile columns and each template placeholder, preview the recipients, then send using an approved template.</p>
 <div class="grid"><div class="field"><label>Approved template</label><select id="csvTemplate" onchange="updateCsvVariableMappings()"><option value="">Select approved template</option>${approvedTemplateRows.map(t=>`<option value="${t.id}">${esc(t.name)} — ${esc(t.template_name)}</option>`).join('')}</select></div><div class="field"><label>Airtable CSV file</label><input id="csvFile" type="file" accept=".csv,text/csv" onchange="previewCsvFile()"></div></div>
 <div id="csvMapping" class="hidden"></div><div id="csvImageWrap" class="field hidden"><label>Re-upload the same JPG/PNG header image for this send batch (required for image-header templates)</label><input id="csvHeaderImage" type="file" accept="image/png,image/jpeg"></div><div id="csvResult" class="small muted"></div>
 </div>
 <div class="card"><h3>My templates and drafts</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>Template name</th><th>Language</th><th>Category</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${a.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.template_name||'—')}</td><td>${esc(t.language||'en')}</td><td>${esc(t.category||'—')}</td><td><span class="pill">${esc(t.approval_status||'DRAFT')}</span></td><td>${esc(t.created_at)}</td><td class="row">${(t.approval_status==='DRAFT'||t.approval_status==='REJECTED')?`<button class="btn" onclick="submitSavedTemplate(${t.id})">Submit</button>`:''}${t.approval_status==='APPROVED'?'<span class="muted small">Ready to send</span>':''}<button class="btn danger" onclick="deleteTemplate(${t.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No templates yet.</td></tr>'}</tbody></table></div></div>`;
}
async function uploadTemplateImage(input){
 const file=input.files?.[0];if(!file)return;
 if(!['image/jpeg','image/png'].includes(file.type))return alert('Please choose a JPG or PNG image.');
 if(file.size>5*1024*1024)return alert('Image must be 5 MB or smaller.');
 try{const fd=new FormData();fd.append('file',file);const d=await apiForm('/templates/upload-image',fd);uploadedTemplateMediaUrl=d.media_url;$('theader').value='';$('timageStatus').textContent='Uploaded to DoubleTick: '+file.name+' (submit template within 24 hours).';}
 catch(e){uploadedTemplateMediaUrl='';$('timageStatus').textContent='Upload failed: '+e.message;alert(e.message)}
}
function selectedCsvTemplate(){return approvedTemplateRows.find(t=>String(t.id)===$('csvTemplate')?.value)}
function csvVarCount(t){const nums=[...new Set((t?.content||'').match(/\{\{\s*\d+\s*\}\}/g)||[])];return nums.length}
function columnOptions(selected=''){return '<option value="">— Select column —</option>'+csvPreviewColumns.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function updateCsvVariableMappings(){
 const box=$('csvMapping'),t=selectedCsvTemplate();if(!box)return;
 if(!csvPreviewColumns.length){box.classList.add('hidden');return}
 const count=csvVarCount(t),find=(words)=>csvPreviewColumns.find(c=>words.some(w=>c.toLowerCase().replace(/[^a-z0-9]/g,'').includes(w)))||'';
 box.classList.remove('hidden');
 $('csvImageWrap')?.classList.toggle('hidden',!t?.header_media_url);
 box.innerHTML=`<div class="grid"><div class="field"><label>Candidate name column (optional)</label><select id="csvNameColumn">${columnOptions(find(['candidatename','fullname','name']))}</select></div><div class="field"><label>Mobile / WhatsApp number column</label><select id="csvPhoneColumn">${columnOptions(find(['mobileno','mobilenumber','whatsapp','phonenumber','contactnumber','phone','mobile']))}</select></div></div>
 <h4>Template variable mapping</h4><div class="grid">${Array.from({length:count},(_,i)=>`<div class="field"><label>{{${i+1}}} — CSV column</label><select class="csvVarColumn" data-index="${i}">${columnOptions(csvPreviewColumns.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,'').includes(['name','specialization','city','state'][i]||''))||'')}</select></div>`).join('')}</div>
 <div class="muted small">CSV preview: ${csvPreviewCount} data rows. Invalid mobile numbers will be skipped. Your account's daily sending limit still applies.</div>
 <button class="btn" onclick="sendCsvBatch()">Send approved template to CSV contacts</button>`;
}
async function previewCsvFile(){
 const file=$('csvFile')?.files?.[0];csvPreviewColumns=[];csvPreviewCount=0;
 if(!file)return;if(file.size>5*1024*1024)return alert('CSV must be 5 MB or smaller.');
 try{const fd=new FormData();fd.append('file',file);const d=await apiForm('/csv/preview',fd);csvPreviewColumns=d.columns;csvPreviewCount=d.row_count;updateCsvVariableMappings();$('csvResult').textContent='CSV loaded: '+d.row_count+' rows, '+d.columns.length+' columns.';}
 catch(e){$('csvResult').textContent=e.message;alert(e.message)}
}
async function sendCsvBatch(){
 const file=$('csvFile')?.files?.[0],template=selectedCsvTemplate(),phone=$('csvPhoneColumn')?.value;
 if(!file||!template||!phone)return alert('Select an approved template, CSV file and mobile number column.');
 const name=$('csvNameColumn')?.value||'',vars=[...document.querySelectorAll('.csvVarColumn')].map(x=>x.value);
 if(vars.some(x=>!x))return alert('Select a CSV column for every template placeholder.');
 if(!confirm(`Send approved template "${template.template_name}" to ${csvPreviewCount} CSV rows? Invalid numbers will be skipped and your daily limit applies.`))return;
 try{const fd=new FormData();fd.append('file',file);fd.append('template_id',template.id);fd.append('name_column',name);fd.append('phone_column',phone);fd.append('variables_json',JSON.stringify(vars));const headerFile=$('csvHeaderImage')?.files?.[0];if(headerFile)fd.append('header_image',headerFile);$('csvResult').textContent='Sending messages… please keep this page open.';
 const d=await apiForm('/csv/send',fd);$('csvResult').textContent=`Completed. Accepted/enqueued: ${d.summary.sent}, failed: ${d.summary.failed}, skipped: ${d.summary.skipped}. See Message History for delivery updates.`;alert($('csvResult').textContent);}
 catch(e){$('csvResult').textContent=e.message;alert(e.message)}
}
async function templatePayload(){return {name:$('tname').value.trim(),kind:'custom',content:$('tcontent').value.trim(),template_name:$('tapproved').value.trim(),language:$('tlang').value,category:$('tcategory').value,header_text:$('theader').value.trim(),footer_text:$('tfooter').value.trim(),header_media_url:uploadedTemplateMediaUrl,header_format:uploadedTemplateMediaUrl?'IMAGE':'TEXT'}}
async function saveTemplatePage(){try{let p=await templatePayload();await api('/templates',{method:'POST',body:JSON.stringify(p)});alert('Draft saved.');uploadedTemplateMediaUrl='';templatesPage()}catch(e){alert(e.message)}}
async function saveAndSubmitTemplate(){try{let p=await templatePayload();if(!p.name||!p.content)return alert('Display name and body are required.');await api('/templates',{method:'POST',body:JSON.stringify(p)});let all=await api('/templates');let t=all.find(x=>x.name===p.name&&x.content===p.content&&x.approval_status==='DRAFT');if(!t)throw new Error('Draft saved, but could not find it for submission. Open My Templates and submit it there.');let r=await api('/templates/'+t.id+'/submit',{method:'POST'});alert('Submitted to DoubleTick. Current status: '+r.status);uploadedTemplateMediaUrl='';templatesPage()}catch(e){alert(e.message)}}
async function submitSavedTemplate(id){if(!confirm('Submit this template to DoubleTick for WhatsApp approval?'))return;try{let r=await api('/templates/'+id+'/submit',{method:'POST'});alert('Submitted. Status: '+r.status);templatesPage()}catch(e){alert(e.message)}}
async function refreshTemplateStatuses(){try{let r=await api('/templates/refresh-status',{method:'POST'});alert(r.message+' Updated: '+r.updated+'; statuses: '+JSON.stringify(r.statuses||{}));let a=await api('/templates');renderTemplates(a)}catch(e){alert(e.message)}}
async function deleteTemplate(id){if(confirm('Delete this template?')){await api('/templates/'+id,{method:'DELETE'});templatesPage()}}
let activeChatPhone='',activeChatName='',chatRefreshTimer=null;
async function chatsPage(){
 if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null}
 let a=await api('/chats');
 $('view').innerHTML=`<div class="heading"><div><h1>WhatsApp Chats</h1><div class="muted">Live candidate conversations. Messages refresh automatically without clearing your draft.</div></div><button class="btn secondary" onclick="refreshChats()">↻ Refresh</button></div><div class="card"><div class="grid" style="grid-template-columns:280px 1fr;align-items:start"><div><div class="field"><label>Search candidate / mobile</label><input id="chatSearch" placeholder="Search…" oninput="filterChatList()"></div><div id="chatlist" style="max-height:70vh;overflow:auto">${chatListHtml(a)}</div></div><div id="chatdetail" class="muted">Select a candidate to open conversation.</div></div></div>`;
 chatRefreshTimer=setInterval(()=>refreshChats().catch(e=>console.warn('Chat refresh:',e)),10000);
}
async function refreshChats(){
 const search=$('chatSearch'),q=search?.value||'';
 const a=await api('/chats'),list=$('chatlist');
 if(list){list.innerHTML=chatListHtml(a);if(search){$('chatSearch').value=q;filterChatList()}}
 if(activeChatPhone && $('chatdetail')) await refreshChatMessages(activeChatPhone);
}
function chatListHtml(a){return a.map(x=>`<div class="nav chatitem" style="border-bottom:1px solid #edf0f4" data-phone="${esc(x.phone)}" data-search="${esc((x.candidate_name||'')+' '+(x.phone||'')).toLowerCase()}" onclick="openChat('${esc(x.phone)}','${esc(x.candidate_name||x.phone)}')"><b>${esc(x.candidate_name||x.phone)}</b><div class="small muted">${esc(x.phone)} · ${x.message_count||0} messages</div><div class="small muted">${esc(x.last_at||'')}</div></div>`).join('')||'<p class="muted">No conversations yet. Confirm DoubleTick MESSAGE_RECEIVED webhook configuration.</p>'}
function filterChatList(){let q=($('chatSearch')?.value||'').toLowerCase();document.querySelectorAll('.chatitem').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}
async function openChat(phone,name){activeChatPhone=phone;activeChatName=name;await renderChat(phone,name)}
function chatMessageHtml(a){return a.map(x=>`<div style="display:flex;justify-content:${x.direction==='IN'?'flex-start':'flex-end'};margin:9px 0"><div style="max-width:78%;padding:10px 13px;border-radius:12px;background:${x.direction==='IN'?'#fff':'#dbeafe'};border:1px solid #e5e7eb"><div class="small muted">${x.direction==='IN'?'Candidate':'You'} · ${esc(x.created_at||'')}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.content||'['+(x.message_type||'MESSAGE')+']')}</div>${x.media_url?`<a target="_blank" rel="noopener" href="${esc(x.media_url)}">Open ${esc(x.message_type||'media')}</a>`:''}${x.status?`<div class="small muted">${esc(x.status)}</div>`:''}</div></div>`).join('')||'<p class="muted">No messages saved for this candidate yet. Check DoubleTick MESSAGE_RECEIVED webhook delivery and server logs.</p>'}
async function renderChat(phone,name){
 const box=$('chatdetail');if(!box)return;
 box.innerHTML=`<div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(name)}</h3><div class="muted small">${esc(phone)}</div></div><button class="btn secondary" onclick="refreshChatMessages('${esc(phone)}')">↻</button></div><div id="chatmessages" style="height:52vh;overflow:auto;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:12px"><p class="muted">Loading messages…</p></div><div style="display:flex;gap:8px;margin-top:10px"><textarea id="chatReplyText" rows="2" maxlength="4000" placeholder="Type a WhatsApp reply…" style="flex:1;resize:vertical;border:1px solid #d6dce6;border-radius:9px;padding:11px;font:inherit" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatReply()}"></textarea><button class="btn" id="chatSendBtn" onclick="sendChatReply()">Send</button></div><div class="small muted" style="margin-top:7px">Free-form text replies work only within WhatsApp's 24-hour customer service window after the candidate's last message. Outside that window, send an approved template.</div><div id="chatReplyError" class="alert hidden"></div>`;
 await refreshChatMessages(phone,true);
}
async function refreshChatMessages(phone,initial=false){
 if(phone!==activeChatPhone)return;
 const box=$('chatmessages');if(!box)return;
 const wasNearBottom=(box.scrollHeight-box.scrollTop-box.clientHeight)<100;
 const draft=$('chatReplyText')?.value;
 const a=await api('/chats/'+encodeURIComponent(phone));
 if(phone!==activeChatPhone||!$('chatmessages'))return;
 $('chatmessages').innerHTML=chatMessageHtml(a);
 if(wasNearBottom||initial)$('chatmessages').scrollTop=$('chatmessages').scrollHeight;
 // Never replace the composer during polling; preserve any text currently being typed.
 if(draft!==undefined && $('chatReplyText') && $('chatReplyText').value!==draft)$('chatReplyText').value=draft;
}
async function sendChatReply(){
 const field=$('chatReplyText'),btn=$('chatSendBtn');if(!field||!activeChatPhone)return;
 const message=field.value.trim();if(!message)return;
 btn.disabled=true;btn.textContent='Sending…';const err=$('chatReplyError');if(err){err.classList.add('hidden');err.textContent=''}
 try{
  const result=await api('/chats/'+encodeURIComponent(activeChatPhone)+'/reply',{method:'POST',body:JSON.stringify({message})});
  field.value='';await refreshChatMessages(activeChatPhone,true);await refreshChats();
 }catch(e){if(err){err.textContent=e.message;err.classList.remove('hidden')}else alert(e.message)}
 finally{if($('chatSendBtn')){$('chatSendBtn').disabled=false;$('chatSendBtn').textContent='Send'}}
}
async function historyPage(){await refreshHistoryTable();historyTimer=setInterval(()=>refreshHistoryTable().catch(e=>console.warn(e)),12000)}
async function refreshHistoryTable(){let a=await api('/history');let view=$('view');if(!view)return;let existing=view.querySelector('#historybody');if(!existing){view.innerHTML=`<div class="heading"><div><h1>Message History</h1><div class="muted">${me.role==='admin'?'All HR users':'Your'} recent sending activity. Status auto-refreshes every 12 seconds.</div></div><button class="btn secondary" onclick="refreshHistoryTable()">↻ Refresh status</button></div><div class="card"><div class="tablewrap"><table><thead><tr>${me.role==='admin'?'<th>HR User</th>':''}<th>Candidate</th>${me.role==='admin'?'<th>Phone</th>':''}<th>Type</th><th>Template</th><th>Status</th><th>Date</th><th>Details</th></tr></thead><tbody id="historybody"></tbody></table></div></div>`;existing=view.querySelector('#historybody')}existing.innerHTML=a.map(x=>{let st=String(x.status||'UNKNOWN').toUpperCase();let colors={READ:['#dcfce7','#166534'],DELIVERED:['#dcfce7','#166534'],SENT:['#dbeafe','#1d4ed8'],ENQUEUED:['#fef3c7','#92400e'],PROCESSING:['#fef3c7','#92400e'],FAILED:['#fee2e2','#991b1b'],UNKNOWN:['#e5e7eb','#374151']};let color=colors[st]||colors.UNKNOWN;return `<tr>${me.role==='admin'?'<td>'+esc(x.username)+'</td>':''}<td>${esc(x.candidate_name)}</td>${me.role==='admin'?'<td>'+esc(x.phone)+'</td>':''}<td>${esc(x.kind)}</td><td>${esc(x.template_name)}</td><td><span class="pill" style="background:${color[0]};color:${color[1]}">${esc(st)}</span></td><td>${esc(x.created_at)}</td><td title="${esc(x.detail)}">${esc((x.detail||'').slice(0,90))}</td></tr>`}).join('')||'<tr><td colspan="8">No message history yet.</td></tr>'}
async function usersPage(){let a=await api('/admin/users');$('view').innerHTML=`<div class="heading"><div><h1>HR User Management</h1><div class="muted">Create and manage individual HR accounts.</div></div></div><div class="card"><h3>Create HR user</h3><div class="grid"><div class="field"><label>Username</label><input id="newuser" placeholder="hr_name"></div><div class="field"><label>Password (min. 8 characters)</label><input id="newpass" type="password"></div><div class="field" style="justify-content:end"><button class="btn" onclick="createUser()">Create user</button></div></div></div><div class="card"><h3>HR accounts</h3><div class="tablewrap"><table><thead><tr><th>Username</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.username)}</td><td>${x.active?'Active':'Inactive'}</td><td>${esc(x.created_at)}</td><td class="row"><button class="btn secondary" onclick="resetPass(${x.id})">Reset password</button><button class="btn ${x.active?'danger':'secondary'}" onclick="toggleUser(${x.id},${!x.active})">${x.active?'Deactivate':'Activate'}</button></td></tr>`).join('')||'<tr><td colspan="4">No HR users.</td></tr>'}</tbody></table></div></div>`}async function createUser(){try{await api('/admin/users',{method:'POST',body:JSON.stringify({username:$('newuser').value,password:$('newpass').value})});usersPage()}catch(e){alert(e.message)}}async function resetPass(id){let p=prompt('Enter new password (minimum 8 characters):');if(p===null)return;try{await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({password:p})});alert('Password updated.')}catch(e){alert(e.message)}}async function toggleUser(id,active){try{await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({active})});usersPage()}catch(e){alert(e.message)}}
async function settingsPage(){let c=await api('/admin/config');$('view').innerHTML=`<div class="heading"><div><h1>Airtable Settings</h1><div class="muted">Add multiple Airtable candidate views. Records from all links are combined for HR users.</div></div></div><div class="card"><div class="field"><label>Airtable shared view / direct view URLs (one URL per line)</label><textarea id="airurls" placeholder="https://airtable.com/...">${esc(c.airtable_urls.join('\n'))}</textarea></div><div class="field"><label>Maximum WhatsApp message attempts per HR user per day</label><input id="hrlimit" type="number" min="1" max="5000" value="${esc(c.max_messages_per_user_per_day)}" /></div><div class="muted small">HR users cannot see candidate mobile numbers. Each HR account is limited to this many message attempts per India calendar day. Failed attempts also count to prevent repeated retries.</div><div style="margin-top:15px"><button class="btn" onclick="saveAir()">Save settings</button></div><div class="alert" style="margin-top:16px">Airtable token and DoubleTick proxy credentials must be configured as backend environment variables. Never paste API secrets into this dashboard.</div></div>`}async function saveAir(){try{await api('/admin/config',{method:'PUT',body:JSON.stringify({urls:$('airurls').value.split('\n').map(x=>x.trim()).filter(Boolean),max_messages_per_user_per_day:Number($('hrlimit').value)})});alert('Settings saved.');settingsPage()}catch(e){alert(e.message)}}
if(token)boot();
</script></body></html>
